<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小黑盤控制台</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="bluetooth.js"></script>
<script src="sensor.js"></script>
<script src="command.js"></script>
<script src="led.js"></script>
</head>
<body>

<header id="topbar">
  <h1><span class="logo-dot"></span>小黑盤控制台</h1>
  <div class="pill" id="pill1"><span class="dot"></span><span id="pill1-name">裝置 1</span></div>
  <div class="pill" id="pill2"><span class="dot"></span><span id="pill2-name">裝置 2</span></div>
  <button id="btn-scan">連接裝置</button>
</header>

<div id="grid">

  <!-- 左欄：兩個裝置狀態 -->
  <div class="col-left">

    <!-- 裝置1 -->
    <div class="card">
      <div class="card-head">
        <span class="card-title" style="color:var(--accent)">● 裝置 1</span>
        <span class="tag tag-off" id="d1-power">電池</span>
      </div>
      <div class="card-body">
        <div class="stat-row"><span class="stat-label">名稱</span><span class="stat-val" id="d1-name" style="color:var(--accent)">—</span></div>
        <div class="stat-row"><span class="stat-label">充電</span><span class="tag tag-off" id="d1-charging">關閉</span></div>
        <div>
          <div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px">
            <span style="color:var(--text3)">電量</span>
            <span id="d1-batt-pct" style="font-weight:700;color:var(--success)">—</span>
          </div>
          <div class="batt-bar"><div class="batt-fill" id="d1-batt-fill" style="width:0%"></div></div>
        </div>
      </div>
    </div>

    <!-- 裝置2 -->
    <div class="card">
      <div class="card-head">
        <span class="card-title" style="color:var(--success)">● 裝置 2</span>
        <span class="tag tag-off" id="d2-power">電池</span>
      </div>
      <div class="card-body">
        <div class="stat-row"><span class="stat-label">名稱</span><span class="stat-val" id="d2-name" style="color:var(--success)">—</span></div>
        <div class="stat-row"><span class="stat-label">充電</span><span class="tag tag-off" id="d2-charging">關閉</span></div>
        <div>
          <div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px">
            <span style="color:var(--text3)">電量</span>
            <span id="d2-batt-pct" style="font-weight:700;color:var(--success)">—</span>
          </div>
          <div class="batt-bar"><div class="batt-fill" id="d2-batt-fill" style="width:0%"></div></div>
        </div>
      </div>
    </div>

    <!-- 紅外線 -->
    <div class="card" style="flex:1">
      <div class="card-head"><span class="card-title">紅外線（裝置1）</span></div>
      <div class="card-body" style="align-items:center;justify-content:center">
        <div class="ir-big" id="ir-val">0<span class="ir-unit">cm</span></div>
        <div class="ir-badge" id="ir-badge">⚠ 距離達標</div>
        <div class="ir-thresh">
          <label>閾值</label>
          <input class="ir-input" type="number" id="ir-thresh" min="0" max="65535" value="0" placeholder="0~65535">
        </div>
      </div>
    </div>

  </div><!-- /col-left -->

  <!-- 中欄 -->
  <div class="col-mid">

    <!-- G-Sensor 兩組 -->
    <div class="card">
      <div class="card-head"><span class="card-title">G-Sensor</span></div>
      <div class="card-body">
        <!-- 裝置1 -->
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:2px">
          <span style="font-size:10px;font-weight:700;color:var(--accent);min-width:42px">裝置 1</span>
          <div class="axis-row" style="flex:1">
            <div class="axis-box"><div class="axis-lbl">X</div><div class="axis-num" id="d1-gx">—</div></div>
            <div class="axis-box"><div class="axis-lbl">Y</div><div class="axis-num" id="d1-gy">—</div></div>
            <div class="axis-box"><div class="axis-lbl">Z</div><div class="axis-num" id="d1-gz">—</div></div>
            <div class="axis-box"><div class="axis-lbl">PITCH</div><div class="axis-num" style="color:var(--warning)" id="d1-pitch">—</div></div>
            <div class="axis-box"><div class="axis-lbl">ROLL</div><div class="axis-num" style="color:var(--warning)" id="d1-roll">—</div></div>
          </div>
        </div>
        <!-- 裝置2 -->
        <div style="display:flex;align-items:center;gap:6px">
          <span style="font-size:10px;font-weight:700;color:var(--success);min-width:42px">裝置 2</span>
          <div class="axis-row" style="flex:1">
            <div class="axis-box"><div class="axis-lbl">X</div><div class="axis-num" id="d2-gx">—</div></div>
            <div class="axis-box"><div class="axis-lbl">Y</div><div class="axis-num" id="d2-gy">—</div></div>
            <div class="axis-box"><div class="axis-lbl">Z</div><div class="axis-num" id="d2-gz">—</div></div>
            <div class="axis-box"><div class="axis-lbl">PITCH</div><div class="axis-num" style="color:var(--warning)" id="d2-pitch">—</div></div>
            <div class="axis-box"><div class="axis-lbl">ROLL</div><div class="axis-num" style="color:var(--warning)" id="d2-roll">—</div></div>
          </div>
        </div>
        <!-- 夾角 -->
        <div style="display:flex;justify-content:flex-end;align-items:center;gap:8px;padding-top:4px;border-top:1px solid var(--border)">
          <span style="font-size:11px;color:var(--text3)">兩裝置夾角</span>
          <span id="joint-angle" style="font-size:16px;font-weight:700;color:var(--danger)">—</span>
        </div>
        <!-- 靈敏度 -->
        <div class="seg">
          <button class="active" data-g="1">±2G</button>
          <button data-g="2">±4G</button>
          <button data-g="3">±8G</button>
        </div>
      </div>
    </div>

    <!-- 角度紀錄 + 折線圖 -->
    <div class="card" style="flex:1">
      <div class="card-head" style="flex-wrap:wrap;gap:5px">
        <span class="card-title">角度紀錄</span>
        <div style="display:flex;gap:5px;align-items:center;flex-wrap:wrap">
          <span id="zero-hint" style="font-size:10px;color:var(--text3)">基準：未設定</span>
          <button class="btn-sm" id="btn-zero" style="border-color:#7c3aed;color:#7c3aed">⊙ 歸零</button>
          <select id="rec-interval" style="font-size:11px;padding:3px 5px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);font-family:inherit">
            <option value="0.5">每 0.5 秒</option>
            <option value="1" selected>每 1 秒</option>
            <option value="2">每 2 秒</option>
            <option value="5">每 5 秒</option>
            <option value="10">每 10 秒</option>
          </select>
          <button class="rec-btn" id="btn-rec">● 紀錄</button>
          <button class="rec-btn export" id="btn-export">↓ CSV</button>
          <button class="rec-btn export" id="btn-export-chart">↓ 圖</button>
        </div>
      </div>
      <div class="card-body" style="overflow:hidden;flex-direction:row;gap:10px">
        <!-- 左：折線圖 -->
        <div style="flex:1.2;display:flex;flex-direction:column;min-width:0">
          <canvas id="chartCanvas" width="200" height="90" style="width:100%;height:100%;border-radius:6px;background:var(--surface2);border:1px solid var(--border)"></canvas>
        </div>
        <!-- 右：數據表格 -->
        <div style="flex:1;display:flex;flex-direction:column;gap:4px;min-width:0;overflow:hidden">
          <div class="log-head" style="grid-template-columns:44px repeat(5,1fr)">
            <span>時間</span><span>裝1</span><span>裝2</span><span>夾角</span><span>P1</span><span>P2</span>
          </div>
          <div class="log-body" id="log-body">
            <div class="empty-hint">尚未開始紀錄</div>
          </div>
        </div>
      </div>
    </div>


    <!-- LED -->
    <div class="card" style="flex:1">
      <div class="card-head">
        <span class="card-title">LED（1 ~ 18）</span>
        <div style="display:flex;gap:6px;align-items:center">
          <span style="font-size:10px;color:var(--text3)" id="led-mode-label">第 <span id="cur-led-num">1</span> 顆</span>
          <select id="led-target" style="font-size:11px;padding:3px 6px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);cursor:pointer;font-family:inherit">
            <option value="d1">裝置 1</option>
            <option value="d2">裝置 2</option>
            <option value="both">兩台</option>
          </select>
          <button class="btn-sm" id="btn-reset-led">重設</button>
        </div>
      </div>
      <div class="card-body">
        <div class="mode-row">
          <button class="mode-btn active" id="mode-single">單顆調色</button>
          <button class="mode-btn" id="mode-all">整體調色</button>
        </div>
        <!-- 左右排版：左邊LED格，右邊RGB -->
        <div style="display:flex;gap:12px;flex:1;min-height:0">
          <!-- 左：18顆 LED，3排×6 -->
          <div style="flex:1;min-width:0">
            <div class="led-grid" id="led-grid"></div>
          </div>
          <!-- 右：RGB滑桿 + 色盤 -->
          <div style="width:160px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;justify-content:center">
            <div class="rgb-row">
              <span class="rgb-lbl" style="color:#ef4444">R</span>
              <input type="range" id="r-sl" min="0" max="255" value="0" style="accent-color:#ef4444">
              <span class="rgb-val" id="r-val">0</span>
            </div>
            <div class="rgb-row">
              <span class="rgb-lbl" style="color:#10b981">G</span>
              <input type="range" id="g-sl" min="0" max="255" value="0" style="accent-color:#10b981">
              <span class="rgb-val" id="g-val">0</span>
            </div>
            <div class="rgb-row">
              <span class="rgb-lbl" style="color:#2563eb">B</span>
              <input type="range" id="b-sl" min="0" max="255" value="0" style="accent-color:#2563eb">
              <span class="rgb-val" id="b-val">0</span>
            </div>
            <div style="display:flex;align-items:center;gap:6px;margin-top:2px">
              <input type="color" id="color-picker" value="#000000">
              <div id="color-preview" style="flex:1;height:24px;border-radius:5px;border:1px solid var(--border);background:#000"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div><!-- /col-mid -->

  <!-- 右欄 -->
  <div class="col-right">

    <!-- 姿態顯示（水平腿） -->
    <div class="card">
      <div class="card-head"><span class="card-title">姿態顯示</span></div>
      <div class="card-body" style="align-items:center;justify-content:center">
        <canvas id="attitudeCanvas" width="240" height="120"></canvas>
      </div>
    </div>

    <!-- 聲音震動 -->
    <div class="card">
      <div class="card-head"><span class="card-title">聲音 &amp; 震動</span></div>
      <div class="card-body">
        <div class="slider-block">
          <div class="slider-top"><span class="lbl">頻率</span><span class="val" id="freq-disp">0 Hz</span></div>
          <input type="range" id="freq-sl" min="0" max="65535" value="0">
        </div>
        <div class="slider-block">
          <div class="slider-top"><span class="lbl">音量</span><span class="val" id="vol-disp">0 %</span></div>
          <input type="range" id="vol-sl" min="0" max="100" value="0">
        </div>
        <div class="divider"></div>
        <div class="toggle-row">
          <span class="toggle-lbl">震動</span>
          <label class="toggle"><input type="checkbox" id="vib-toggle"><span class="toggle-track"></span></label>
        </div>
      </div>
    </div>

    <!-- 裝置回饋 -->
    <div class="card">
      <div class="card-head"><span class="card-title">裝置回饋</span></div>
      <div class="card-body">
        <div class="fb-grid">
          <div class="fb-box"><div class="fb-lbl">震動</div><div class="fb-val" id="fb-vib">—</div></div>
          <div class="fb-box"><div class="fb-lbl">電源</div><div class="fb-val" id="fb-pwr">—</div></div>
          <div class="fb-box"><div class="fb-lbl">充電</div><div class="fb-val" id="fb-chg">—</div></div>
          <div class="fb-box"><div class="fb-lbl">IR</div><div class="fb-val" id="fb-ir">0</div></div>
        </div>
      </div>
    </div>


  </div><!-- /col-right -->

</div>
<script src="app.js"></script>
</body>
</html>
